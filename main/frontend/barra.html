<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barra en Vivo - Melie Coffee</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #121212; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .top-bar { background: #000; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #d4af37; }
        .top-brand { display: flex; align-items: center; gap: 14px; }
        .top-brand img { height: 42px; border-radius: 6px; }
        .badge-count { background: #d4af37; color: #000; padding: 4px 12px; border-radius: 20px; font-weight: 800; font-size: 16px; }
        .btn-salir { background: #334155; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .ordenes-grid { flex: 1; padding: 18px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; align-content: start; }
        .orden-card { background: #1e293b; border-radius: 10px; border: 2px solid #334155; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
        .orden-header { padding: 12px 15px; background: #0f172a; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .orden-num { font-size: 20px; font-weight: 900; color: #d4af37; }
        .orden-hora { font-size: 13px; color: #94a3b8; font-weight: bold; }
        .orden-meta { padding: 8px 15px; font-weight: 800; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
        .meta-aqui { background: #1e3a8a; color: #bfdbfe; }
        .meta-llevar { background: #78350f; color: #fde68a; }
        .orden-items { padding: 12px 15px; flex: 1; }
        .item-row { padding: 8px 0; border-bottom: 1px dashed #334155; }
        .item-row:last-child { border-bottom: none; }
        .item-nombre { font-size: 16px; font-weight: 700; color: #fff; }
        .item-tam { background: #d4af37; color: #000; padding: 1px 6px; border-radius: 4px; font-size: 12px; font-weight: 800; margin-left: 4px; }
        .item-extras { font-size: 13.5px; color: #38bdf8; margin-top: 3px; padding-left: 8px; font-weight: 600; }
        .btn-listo { width: 100%; padding: 14px; background: #16a34a; color: #fff; border: none; font-size: 16px; font-weight: 800; cursor: pointer; }
        .btn-listo:active { background: #15803d; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="top-brand">
            <img src="IMG-20261007-WA0005.jpg" alt="Melie" onerror="this.style.display='none'">
            <h2 style="margin:0; font-size:20px; color:#d4af37;">☕ MONITOR DE BARRA (TICKETS EN VIVO)</h2>
            <span class="badge-count" id="contador-pendientes">0 pendientes</span>
        </div>
        <div style="display:flex; gap:10px;">
            <button class="btn-salir" onclick="cargarPendientes(true)">🔄 Actualizar</button>
            <button class="btn-salir" style="background:#dc2626;" onclick="window.location.href='login.html'">⬅ Volver al Login</button>
        </div>
    </div>

    <div class="ordenes-grid" id="contenedor-ordenes"></div>

    <script>
        const API_URL = window.location.port === "8000" ? window.location.origin : "http://192.168.1.84:8000";
        let firmaAnterior = "";

        async function cargarPendientes(forzar = false) {
            try {
                const res = await fetch(`${API_URL}/api/barra/pendientes`);
                const data = await res.json();
                if (!data.exito) return;

                const firmaActual = JSON.stringify(data.ordenes);
                if (!forzar && firmaActual === firmaAnterior) return; // Evita sobrecargar CPU/DOM si no hay cambios
                firmaAnterior = firmaActual;

                const cont = document.getElementById('contenedor-ordenes');
                document.getElementById('contador-pendientes').innerText = `${data.ordenes.length} pendientes`;

                if (data.ordenes.length === 0) {
                    cont.innerHTML = `<div style="grid-column: 1 / -1; text-align:center; padding:80px 20px; color:#64748b; font-size:22px;">✅ Sin órdenes pendientes en barra.</div>`;
                    return;
                }

                cont.innerHTML = data.ordenes.map(o => {
                    const esLlevar = o.tipo_orden === 'llevar';
                    const claseMeta = esLlevar ? 'meta-llevar' : 'meta-aqui';
                    const textoTipo = esLlevar ? '🛍️ PARA LLEVAR' : '🍽️ COMER AQUÍ';

                    const itemsHtml = o.items.map(it => {
                        const tam = it.tamano_elegido ? `<span class="item-tam">${it.tamano_elegido}</span>` : '';
                        const limpioExtras = it.detalles_extras ? it.detalles_extras.replace(/\(\+\$\d+(\.\d+)?\)/g, '') : '';
                        const extras = limpioExtras ? `<div class="item-extras">➕ ${limpioExtras}</div>` : '';
                        return `<div class="item-row">
                            <div class="item-nombre">${it.cantidad}x ${it.nombre_producto} ${tam}</div>
                            ${extras}
                        </div>`;
                    }).join('');

                    return `<div class="orden-card">
                        <div>
                            <div class="orden-header">
                                <span class="orden-num">Orden #${o.id_venta}</span>
                                <span class="orden-hora">🕒 ${o.hora}</span>
                            </div>
                            <div class="orden-meta ${claseMeta}">
                                <span>👤 ${o.cliente_nombre || 'Mostrador'}</span>
                                <span>${textoTipo}</span>
                            </div>
                            <div class="orden-items">${itemsHtml}</div>
                        </div>
                        <button class="btn-listo" onclick="marcarOrdenLista(${o.id_venta})">✅ ORDEN LISTA (DESPACHAR)</button>
                    </div>`;
                }).join('');
            } catch (e) { console.error(e); }
        }

        async function marcarOrdenLista(id_venta) {
            try {
                const res = await fetch(`${API_URL}/api/barra/${id_venta}/listo`, { method: 'PUT' });
                const r = await res.json();
                if (r.exito) cargarPendientes(true);
            } catch (e) { console.error(e); }
        }

        cargarPendientes(true);
        setInterval(() => cargarPendientes(false), 4000);
    </script>
</body>
</html>
